name: Publish validated C2000MAX firmware

on:
  push:
    branches:
      - c2000max-v35.35
    paths:
      - ".github/workflows/c2000max-publish-validated.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VALIDATION_RUN_ID: "31888250930"
      VALIDATED_ARTIFACT: C2000MAX-V35.35-mt5700-validated-firmware
      RELEASE_TAG: c2000max-v35.35-mt5700-recovery-r1

    steps:
      - name: Download validated firmware
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-files
          gh run download "$VALIDATION_RUN_ID" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "$VALIDATED_ARTIFACT" --dir release-files
          test -f release-files/C2000MAX-V35.35-mt5700-serialized-warm-reboot-fix-sysupgrade.bin
          grep -qx 'validation=passed' release-files/VALIDATION.txt
          ls -lh release-files

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          C2000MAX V35.35 MT5700 warm-reboot recovery build.

          Source firmware build: run 31883066413, commit aa4fd3d07c86e95c8b9c5b4969be4c847677ea93.
          Core recovery fix: commit 19ceb1c113ccd14e91e598244e3e67edf71f0beb.

          Automated validation passed:
          - fwtool metadata supports nradio,c2000-max
          - SquashFS rootfs contains START=12 serialized modem restore
          - 120-second AT + CGMM readiness detection is packaged
          - the old 15/30/60 repeated hard-power loop is absent
          - C2000MAX skips QModem AT+CFUN=1,1 during shutdown
          - packaged DTB contains the full 0x14a800 EEPROM nvmem cell and cpe-pwr

          Sysupgrade size: 91433236 bytes
          MD5: b562c5e3cb983c6810b32443075b8a54
          SHA256: f7dc2d3752ae92ec3db58b29df5ba8a71ea858e82d06b4e717ed0818ccfbbe77
          EOF

          gh release create "$RELEASE_TAG" \
            release-files/C2000MAX-V35.35-mt5700-serialized-warm-reboot-fix-sysupgrade.bin \
            release-files/VALIDATION.txt \
            release-files/SHA256SUMS \
            release-files/MD5SUMS \
            release-files/metadata.json \
            --repo "${GITHUB_REPOSITORY}" \
            --target c2000max-v35.35 \
            --title "C2000MAX V35.35 MT5700 warm-reboot recovery R1" \
            --notes-file release-notes.md
