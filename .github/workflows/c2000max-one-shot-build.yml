name: C2000MAX one-shot firmware build

on:
  push:
    branches:
      - c2000max-v36.01
    paths:
      - ".github/workflows/c2000max-one-shot-build.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: c2000max-one-shot-build
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip firmware build]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      FORCE_UNSAFE_CONFIGURE: "1"
      SOURCE_DATE_EPOCH: "1784306413"
      LC_ALL: C
      TZ: UTC

    steps:
      - name: Reclaim runner disk space
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore downloads and compiler cache
        uses: actions/cache@v4
        with:
          path: |
            dl
            .ccache
          key: ${{ runner.os }}-c2000max-v2-${{ hashFiles('feeds.conf.default', 'configs/c2000max.config') }}
          restore-keys: |
            ${{ runner.os }}-c2000max-v2-

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             build-essential clang flex bison g++ gawk gcc-multilib g++-multilib             gettext git libncurses-dev libssl-dev python3-setuptools python3-pyelftools             rsync swig unzip zlib1g-dev file wget curl libelf-dev device-tree-compiler             cpio qemu-utils ca-certificates patch perl

      - name: Install locked feeds
        shell: bash
        run: |
          ./scripts/feeds update -a
          for feed in packages luci routing telephony video; do
            ./scripts/feeds install -a -p "$feed"
          done

      - name: Generate C2000MAX configuration
        shell: bash
        run: |
          cp configs/c2000max.config .config
          make defconfig
          sed -i "s#^CONFIG_CCACHE_DIR=.*#CONFIG_CCACHE_DIR=\"$GITHUB_WORKSPACE/.ccache\"#" .config
          printf '\nCONFIG_CCACHE=y\n' >> .config
          grep -E '^CONFIG_(TARGET_mediatek_filogic_DEVICE_nradio_c2000-max|TARGET_ROOTFS_PARTSIZE|MTK_HWIFI_MT7993|PACKAGE_c2000max-board|PACKAGE_qmodem|PACKAGE_luci-base)=' .config

      - name: Download and verify sources
        shell: bash
        run: |
          make -j"$(nproc)" download
          find dl -type f -size -1024c -print -delete

      - name: Build firmware
        shell: bash
        run: |
          if ! make -j"$(nproc)" world; then
            make -j1 V=s world
          fi

      - name: Collect and checksum images
        shell: bash
        run: |
          test -d bin/targets/mediatek/filogic
          mkdir -p c2000max-artifacts
          find bin/targets/mediatek/filogic -maxdepth 1 -type f \
            -exec cp -a {} c2000max-artifacts/ \;
          test -n "$(find c2000max-artifacts -maxdepth 1 -type f -name '*nradio_c2000-max*' -print -quit)"

      - name: Assemble validated SD image
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_name='C2000MAX-V36.01-traffic-management'
          mapfile -d '' sysupgrades < <(
            find c2000max-artifacts -maxdepth 1 -type f \
              -name '*nradio_c2000-max*-sysupgrade.bin' -print0
          )
          test "${#sysupgrades[@]}" -eq 1
          mv "${sysupgrades[0]}" \
            "c2000max-artifacts/${release_name}-sysupgrade.bin"

          mkdir -p c2000max-reference
          gh release download c2000max-v35.35-port-role-lock-r1 \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern '*sdcard.img.gz' --dir c2000max-reference
          mapfile -d '' references < <(
            find c2000max-reference -maxdepth 1 -type f \
              -name '*sdcard.img.gz' -print0
          )
          test "${#references[@]}" -eq 1
          gzip -dc "${references[0]}" > c2000max-reference/reference.img

          python3 scripts/c2000max/assemble-c2000max-sdcard.py \
            c2000max-reference/reference.img \
            "c2000max-artifacts/${release_name}-sysupgrade.bin" \
            "c2000max-artifacts/${release_name}-sdcard.img" \
            --overlay-mib 512 | tee c2000max-artifacts/sdcard-assembly.txt
          gzip -n -9 "c2000max-artifacts/${release_name}-sdcard.img"
          gzip -t "c2000max-artifacts/${release_name}-sdcard.img.gz"

      - name: Finalize release checksums
        shell: bash
        run: |
          release_name='C2000MAX-V36.01-traffic-management'
          (
            cd c2000max-artifacts
            find . -maxdepth 1 -type f ! -name c2000max-build-sha256sums.txt \
              -printf '%f\0' | sort -z | xargs -0 sha256sum \
              > c2000max-build-sha256sums.txt
            sha256sum \
              "${release_name}-sysupgrade.bin" \
              "${release_name}-sdcard.img.gz" > SHA256SUMS
            md5sum \
              "${release_name}-sysupgrade.bin" \
              "${release_name}-sdcard.img.gz" > MD5SUMS
            ls -lh
          )

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: C2000MAX-V36.01-traffic-management
          path: |
            c2000max-artifacts/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_name='C2000MAX-V36.01-traffic-management'
          release_tag='c2000max-v36.01'
          source_sha="$GITHUB_SHA"

          # Release creation rejects GITHUB_TOKEN when its target modifies
          # .github/workflows relative to the default branch. Keep the source
          # tree intact while matching only those workflow files to the default
          # branch in an unreferenced release-anchor commit.
          default_branch="$(
            gh repo view "${GITHUB_REPOSITORY}" \
              --json defaultBranchRef --jq '.defaultBranchRef.name'
          )"
          default_sha="$(
            gh api "/repos/${GITHUB_REPOSITORY}/commits/${default_branch}" \
              --jq '.sha'
          )"
          source_tree_sha="$(
            gh api "/repos/${GITHUB_REPOSITORY}/git/commits/${source_sha}" \
              --jq '.tree.sha'
          )"
          default_tree_sha="$(
            gh api "/repos/${GITHUB_REPOSITORY}/git/commits/${default_sha}" \
              --jq '.tree.sha'
          )"
          gh api \
            "/repos/${GITHUB_REPOSITORY}/git/trees/${source_tree_sha}?recursive=1" \
            > "$RUNNER_TEMP/c2000max-source-tree.json"
          gh api \
            "/repos/${GITHUB_REPOSITORY}/git/trees/${default_tree_sha}?recursive=1" \
            > "$RUNNER_TEMP/c2000max-default-tree.json"
          workflow_entries="$(
            jq -n \
              --slurpfile source "$RUNNER_TEMP/c2000max-source-tree.json" \
              --slurpfile default "$RUNNER_TEMP/c2000max-default-tree.json" '
                ([
                  $source[0].tree[]
                  | select((.path | startswith(".github/workflows/")) and .type != "tree")
                  | {
                      key: .path,
                      value: { path: .path, mode: .mode, type: .type, sha: null }
                    }
                ] + [
                  $default[0].tree[]
                  | select((.path | startswith(".github/workflows/")) and .type != "tree")
                  | {
                      key: .path,
                      value: { path: .path, mode: .mode, type: .type, sha: .sha }
                    }
                ])
                | from_entries
                | [.[]]
              '
          )"
          if test "$(jq 'length' <<<"$workflow_entries")" -eq 0; then
            release_target="$source_sha"
          else
            release_tree_sha="$(
              jq -n \
                --arg base_tree "$source_tree_sha" \
                --argjson tree "$workflow_entries" \
                '{ base_tree: $base_tree, tree: $tree }' \
              | gh api --method POST \
                  "/repos/${GITHUB_REPOSITORY}/git/trees" --input - \
              | jq -r '.sha'
            )"
            release_target="$(
              jq -n \
                --arg message \
                  "C2000MAX V36.01 release anchor for ${source_sha}" \
                --arg tree "$release_tree_sha" \
                --arg parent "$source_sha" \
                '{ message: $message, tree: $tree, parents: [$parent] }' \
              | gh api --method POST \
                  "/repos/${GITHUB_REPOSITORY}/git/commits" --input - \
              | jq -r '.sha'
            )"
          fi
          test -n "$release_target"

          cat > release-notes.md <<EOF
          C2000MAX V36.01 正式固件。

          核心更新：
          - HNAT 模式使用硬件 HQoS 进行逐设备限速。
          - Flow Offloading 与普通转发自动切换到 tc/IFB，切换加速方式不丢失规则。
          - 统一统计 HNAT 硬件 MIB、Flowtable 与普通 Conntrack 流量。
          - 按 mwan3 实际出口区分 5G 与其他/宽带，并显示逐设备明细。

          构建来源：
          - 分支：c2000max-v36.01
          - 提交：${GITHUB_SHA}
          - Actions：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Release 至少包含可保留配置升级的 sysupgrade.bin 和完整写卡用的 sdcard.img.gz；校验值见 SHA256SUMS 与 MD5SUMS。
          EOF

          assets=(
            "c2000max-artifacts/${release_name}-sysupgrade.bin"
            "c2000max-artifacts/${release_name}-sdcard.img.gz"
            c2000max-artifacts/SHA256SUMS
            c2000max-artifacts/MD5SUMS
            c2000max-artifacts/sdcard-assembly.txt
          )
          if gh release view "$release_tag" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "$release_tag" "${assets[@]}" \
              --repo "${GITHUB_REPOSITORY}" --clobber
            gh release edit "$release_tag" --repo "${GITHUB_REPOSITORY}" \
              --title 'C2000MAX V36.01 - 流量管理' \
              --notes-file release-notes.md
          else
            gh release create "$release_tag" "${assets[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "$release_target" \
              --title 'C2000MAX V36.01 - 流量管理' \
              --notes-file release-notes.md
          fi
