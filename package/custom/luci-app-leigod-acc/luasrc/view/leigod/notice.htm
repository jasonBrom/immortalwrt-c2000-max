<fieldset class="cbi-section">
  <legend>使用说明</legend>
  <p>此插件需要配合雷神加速器手机 APP 使用。路由器插件负责把选定设备的游戏流量接入雷神线路，账号、套餐和暂停操作请在官方 APP 内完成。</p>
  <p><strong>兼容模式：</strong>本固件固定使用 TUN 模式，并通过 iptables-nft 兼容层接入 fw4/nft 防火墙。启用前请停用其他透明代理服务，避免默认路由或 DNS 规则互相覆盖。</p>
  <p><strong>设备识别：</strong>在“设备管理”中确认客户端连接的局域网接口及设备类型；新接入设备可能需要等待 ARP/DHCP 信息更新后才会出现。</p>
  <p><strong>隐私提示：</strong>启用后，雷神组件会连接其官方服务器；服务关闭时不会启动加速进程。</p>
</fieldset>
