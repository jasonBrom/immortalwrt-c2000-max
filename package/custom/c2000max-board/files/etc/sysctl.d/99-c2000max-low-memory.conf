# C2000MAX has 512 MiB RAM.  The distribution default creates 65536 buckets
# for each conntrack/NAT hash table, which is excessive for this device and is
# doubled by SONiC-style FullCone's translated-source table.
net.netfilter.nf_conntrack_buckets=16384
net.netfilter.nf_conntrack_expect_max=4096
net.netfilter.nf_conntrack_max=32768

# Keep stale established entries from occupying slab for more than two hours.
# Active TCP sessions refresh their timeout normally.
net.netfilter.nf_conntrack_tcp_timeout_established=7200
